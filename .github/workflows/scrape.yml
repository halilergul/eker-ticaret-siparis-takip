name: Scrape

on:
  schedule:
    # 2026-08-03: Ağustos quota reset — cron tekrar aktif. 19-20 TR arası 2 deneme
    # (1. başarılı → 2. "already ran today" skip). Hourly (0 * * * *) yerine bu:
    # ~64 dk/gün × 30 = ~1920 dk/ay (2000 dk budget'ın %96'sı, 80 dk emniyet).
    # Not: Actions için $0 spending limit aktif → 2000'e ulaşırsa otomatik durur.
    - cron: '0 16-17 * * *'
  workflow_dispatch:
    inputs:
      supplier:
        description: 'Tedarikçi slug'
        required: true
        type: choice
        options:
          - enderyapi
          - ikizler
          - leventsimsek
          - yedekler
      trigger_type:
        description: 'Tetikleme tipi'
        required: false
        type: choice
        default: manual
        options:
          - manual

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # 016 fix: schedule event'inde 4 tedarikçi paralel, workflow_dispatch tek supplier.
    # Öncesinde SUPPLIER default 'enderyapi' idi → cron sadece Enderyapı'yı tetikliyordu.
    strategy:
      fail-fast: false
      matrix:
        supplier: ${{ fromJSON(github.event_name == 'schedule' && '["enderyapi","ikizler","leventsimsek","yedekler"]' || format('["{0}"]', github.event.inputs.supplier)) }}
    concurrency:
      group: scrape-${{ matrix.supplier }}
      cancel-in-progress: false
    env:
      SUPPLIER: ${{ matrix.supplier }}
      TRIGGER_TYPE: ${{ github.event.inputs.trigger_type || (github.event_name == 'schedule' && 'auto' || 'manual') }}
      # 011 production smoke: Enderyapı pagination ile 172 sipariş + 489 ürün catalog
      # → toplam runner süresi 21-25 dk gözlendi. 2026-06-22: 490 ürün catalog
      # 30dk timeout'u aştı (0 snapshot, scrapeCatalog buffer'da kaldı). 50dk'ya
      # uzatıldı + scrapeCatalog incremental yazma (onResult callback) eklendi:
      # timeout fırlarsa o ana kadar yazılanlar kalır.
      TIMEOUT_OVERRIDE_MS: '3000000'  # 50 dk (runner timeout-minutes 55 ile uyumlu)
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ENDERYAPI_USERNAME: ${{ secrets.ENDERYAPI_USERNAME }}
      ENDERYAPI_PASSWORD: ${{ secrets.ENDERYAPI_PASSWORD }}
      IKIZLER_USERNAME: ${{ secrets.IKIZLER_USERNAME }}
      IKIZLER_PASSWORD: ${{ secrets.IKIZLER_PASSWORD }}
      LEVENTSIMSEK_USERNAME: ${{ secrets.LEVENTSIMSEK_USERNAME }}
      LEVENTSIMSEK_PASSWORD: ${{ secrets.LEVENTSIMSEK_PASSWORD }}
      YEDEKLER_CUSTOMER_CODE: ${{ secrets.YEDEKLER_CUSTOMER_CODE }}
      YEDEKLER_USER_CODE: ${{ secrets.YEDEKLER_USER_CODE }}
      YEDEKLER_PASSWORD: ${{ secrets.YEDEKLER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check schedule (skip if hour mismatch / disabled)
        id: check
        if: github.event_name == 'schedule'
        run: npx tsx scripts/scrape/check-schedule.ts --supplier "$SUPPLIER"

      - name: Install Playwright Chromium
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.skip == 'false'
        run: npx playwright install --with-deps chromium

      - name: Run scrape (order + catalog combined)
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.skip == 'false'
        run: npm run scrape:all -- --supplier "$SUPPLIER" --trigger-type "$TRIGGER_TYPE"
